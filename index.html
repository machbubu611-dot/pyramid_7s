<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>七秒讀心術 金字塔圖</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: #f5f6f8;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 480px;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .page-title {
    text-align: center;
    font-size: 19px;
    font-weight: 800;
    color: #1f2937;
    letter-spacing: 1px;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
    padding: 18px;
  }

  /* ---- 輸入區 ---- */
  .name-input {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    outline: none;
    margin-bottom: 16px;
  }
  .name-input:focus { border-color: #7c3aed; }

  .date-grid {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  .date-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .date-field label {
    font-size: 12px;
    font-weight: 700;
    color: #6b7280;
    text-align: center;
  }

  .date-field input {
    width: 100%;
    padding: 12px 4px;
    font-size: 16px;
    text-align: center;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    outline: none;
  }
  .date-field input:focus { border-color: #7c3aed; }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1 1 auto;
    min-width: 96px;
    padding: 13px 8px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.85; }
  .btn-purple { background-color: #7c3aed; }
  .btn-red { background-color: #e53e3e; }
  .btn-dark { background-color: #1f2937; }

  /* ---- 圖表區 ---- */
  .chart-card {
    padding: 16px 14px 12px;
  }

  .name-tag {
    font-size: 14px;
    font-weight: 700;
    color: #374151;
    margin-bottom: 6px;
  }

  .pyramid-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .footer-caption {
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .node-box text {
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
  }

  /* ---- 儲存圖片彈窗 ---- */
  .save-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .save-modal.open { display: flex; }

  .save-modal-inner {
    background: #ffffff;
    border-radius: 16px;
    padding: 16px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .save-modal-hint {
    font-size: 13px;
    color: #4b5563;
    text-align: center;
    line-height: 1.6;
  }

  .save-modal-img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid #eee;
    display: block;
  }

  .save-modal-actions {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .save-modal-actions .btn {
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .save-modal-loading {
    font-size: 14px;
    color: #6b7280;
    padding: 30px 0;
  }
</style>
</head>
<body>

<div class="page">
  <div class="page-title">七秒讀心術 金字塔圖</div>

  <!-- 輸入卡片 -->
  <div class="card">
    <input type="text" id="name" class="name-input" placeholder="請輸入姓名">

    <div class="date-grid">
      <div class="date-field">
        <label>年</label>
        <input type="text" id="year" placeholder="YYYY" maxlength="4" inputmode="numeric">
      </div>
      <div class="date-field">
        <label>月</label>
        <input type="text" id="month" placeholder="MM" maxlength="2" inputmode="numeric">
      </div>
      <div class="date-field">
        <label>日</label>
        <input type="text" id="day" placeholder="DD" maxlength="2" inputmode="numeric">
      </div>
    </div>

    <div class="btn-row">
      <button type="button" id="btn-generate" class="btn btn-purple">生成金字塔圖</button>
      <button type="button" id="btn-clear" class="btn btn-red">清除資料</button>
      <button type="button" id="btn-save" class="btn btn-dark">一鍵截圖儲存</button>
    </div>
  </div>

  <!-- 圖表卡片 -->
  <div class="card chart-card" id="chart-canvas">
    <div class="name-tag" id="name-tag">姓名：</div>

    <svg class="pyramid-svg" viewBox="0 0 400 580" xmlns="http://www.w3.org/2000/svg">

      <!-- 主金字塔外框與分隔線 -->
      <polygon points="200,200 60,500 340,500" fill="none" stroke="#333333" stroke-width="2"/>
      <line x1="153" y1="300" x2="247" y2="300" stroke="#333333" stroke-width="1.5"/>
      <line x1="107" y1="400" x2="293" y2="400" stroke="#333333" stroke-width="1.5"/>
      <line x1="200" y1="300" x2="200" y2="500" stroke="#333333" stroke-width="1.5"/>

      <!-- ===== 主金字塔數字 ===== -->
      <g class="node-box">
        <rect x="174" y="227" width="52" height="46" rx="4" fill="#1e2a5e"/>
        <text id="val-O" x="200" y="251" font-size="22" fill="#ffffff">-</text>
      </g>
      <g class="node-box">
        <rect x="149" y="332" width="42" height="36" rx="4" fill="#c9a8f2"/>
        <text id="val-M" x="170" y="351" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="209" y="332" width="42" height="36" rx="4" fill="#3ddc55"/>
        <text id="val-N" x="230" y="351" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="94" y="432" width="42" height="36" rx="4" fill="#c9a8f2"/>
        <text id="val-I" x="115" y="451" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="150" y="432" width="42" height="36" rx="4" fill="#c9a8f2"/>
        <text id="val-J" x="171" y="451" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="208" y="432" width="42" height="36" rx="4" fill="#3ddc55"/>
        <text id="val-K" x="229" y="451" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="264" y="432" width="42" height="36" rx="4" fill="#3ddc55"/>
        <text id="val-L" x="285" y="451" font-size="19" fill="#1f2937">-</text>
      </g>

      <!-- ===== 上方延伸計算：中間（洋紅），對稱三角排列 ===== -->
      <g class="node-box">
        <rect x="179" y="37" width="42" height="36" rx="4" fill="#e83ae0"/>
        <text id="val-magentaTop" x="200" y="55" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="147" y="112" width="42" height="36" rx="4" fill="#e83ae0"/>
        <text id="val-magentaLeft" x="168" y="130" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="211" y="112" width="42" height="36" rx="4" fill="#e83ae0"/>
        <text id="val-magentaRight" x="232" y="130" font-size="19" fill="#1f2937">-</text>
      </g>

      <!-- ===== 上方延伸計算：左側（橘），對稱三角排列 ===== -->
      <g class="node-box">
        <rect x="49" y="97" width="42" height="36" rx="4" fill="#f5a623"/>
        <text id="val-orangeTop" x="70" y="115" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="17" y="172" width="42" height="36" rx="4" fill="#f5a623"/>
        <text id="val-orangeLeft" x="38" y="190" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="81" y="172" width="42" height="36" rx="4" fill="#f5a623"/>
        <text id="val-orangeRight" x="102" y="190" font-size="19" fill="#1f2937">-</text>
      </g>

      <!-- ===== 上方延伸計算：右側（青），對稱三角排列 ===== -->
      <g class="node-box">
        <rect x="309" y="97" width="42" height="36" rx="4" fill="#29b6f6"/>
        <text id="val-cyanTop" x="330" y="115" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="277" y="172" width="42" height="36" rx="4" fill="#29b6f6"/>
        <text id="val-cyanLeft" x="298" y="190" font-size="19" fill="#1f2937">-</text>
      </g>
      <g class="node-box">
        <rect x="341" y="172" width="42" height="36" rx="4" fill="#29b6f6"/>
        <text id="val-cyanRight" x="362" y="190" font-size="19" fill="#1f2937">-</text>
      </g>

      <!-- ===== 底部原始出生日期 ===== -->
      <text id="raw-day" x="115" y="529" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">--</text>
      <text id="raw-month" x="171" y="529" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">--</text>
      <text id="raw-year1" x="229" y="529" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">--</text>
      <text id="raw-year2" x="285" y="529" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">--</text>

      <text x="115" y="553" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">日期</text>
      <text x="171" y="553" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">月份</text>
      <text x="257" y="553" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">年份</text>

      <text x="18" y="528" font-size="13" font-weight="700" fill="#2563eb">公元</text>
      <text x="18" y="546" font-size="13" font-weight="700" fill="#2563eb">出生日期</text>

    </svg>

    <div class="footer-caption">七秒讀心術 金字塔圖</div>
  </div>
</div>

<!-- 儲存圖片彈窗：手機可長按圖片儲存到相簿 -->
<div class="save-modal" id="save-modal">
  <div class="save-modal-inner">
    <p class="save-modal-hint">
      📱 手機：長按下方圖片，選擇「儲存圖片」即可存到相簿<br>
      💻 電腦：點選下方「下載圖片」按鈕
    </p>
    <div id="save-modal-body">
      <p class="save-modal-loading">圖片產生中，請稍候…</p>
    </div>
    <div class="save-modal-actions">
      <a id="save-modal-download" class="btn btn-purple" download="七秒讀心術金字塔圖.png" style="display:none;">下載圖片</a>
      <button type="button" id="save-modal-close" class="btn btn-dark">關閉</button>
    </div>
  </div>
</div>

<script>
  const elYear = document.getElementById('year');
  const elMonth = document.getElementById('month');
  const elDay = document.getElementById('day');
  const elName = document.getElementById('name');
  const elNameTag = document.getElementById('name-tag');

  const btnGenerate = document.getElementById('btn-generate');
  const btnClear = document.getElementById('btn-clear');
  const btnSave = document.getElementById('btn-save');

  const saveModal = document.getElementById('save-modal');
  const saveModalBody = document.getElementById('save-modal-body');
  const saveModalDownload = document.getElementById('save-modal-download');
  const saveModalClose = document.getElementById('save-modal-close');

  const ALL_VAL_IDS = [
    'val-I','val-J','val-K','val-L','val-M','val-N','val-O',
    'val-magentaTop','val-magentaLeft','val-magentaRight',
    'val-orangeTop','val-orangeLeft','val-orangeRight',
    'val-cyanTop','val-cyanLeft','val-cyanRight'
  ];
  const ALL_RAW_IDS = ['raw-day','raw-month','raw-year1','raw-year2'];

  function setText(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  elYear.addEventListener('input', () => { if (elYear.value.length === 4) elMonth.focus(); tryCalculate(); });
  elMonth.addEventListener('input', () => { if (elMonth.value.length === 2) elDay.focus(); tryCalculate(); });
  elDay.addEventListener('input', () => { tryCalculate(); });
  elName.addEventListener('input', () => {
    elNameTag.textContent = '姓名：' + elName.value.trim();
  });

  function addDigits(n1, n2) {
    if (n1 === 0 && n2 === 0) return 5;
    let sum = n1 + n2;
    while (sum >= 10) {
      sum = Math.floor(sum / 10) + (sum % 10);
    }
    return sum;
  }

  function tryCalculate() {
    const y = elYear.value.trim();
    const m = elMonth.value.trim().padStart(2, '0');
    const d = elDay.value.trim().padStart(2, '0');

    if (y.length !== 4 || elMonth.value.trim() === '' || elDay.value.trim() === '') return;

    const A = parseInt(d[0], 10), B = parseInt(d[1], 10);
    const C = parseInt(m[0], 10), D = parseInt(m[1], 10);
    const E = parseInt(y[0], 10), F = parseInt(y[1], 10);
    const G = parseInt(y[2], 10), H = parseInt(y[3], 10);

    const I = addDigits(A, B);
    const J = addDigits(C, D);
    const K = addDigits(E, F);
    const L = addDigits(G, H);

    const M = addDigits(I, J);
    const N = addDigits(K, L);

    const O = addDigits(M, N);

    const magentaLeft = addDigits(O, N);
    const magentaRight = addDigits(O, M);
    const magentaTop = addDigits(magentaLeft, magentaRight);

    const orangeLeft = addDigits(I, M);
    const orangeRight = addDigits(J, M);
    const orangeTop = addDigits(orangeLeft, orangeRight);

    const cyanLeft = addDigits(K, N);
    const cyanRight = addDigits(L, N);
    const cyanTop = addDigits(cyanLeft, cyanRight);

    const values = {
      I, J, K, L, M, N, O,
      magentaTop, magentaLeft, magentaRight,
      orangeTop, orangeLeft, orangeRight,
      cyanTop, cyanLeft, cyanRight
    };

    ALL_VAL_IDS.forEach(id => {
      const key = id.replace('val-', '');
      setText(id, values[key]);
    });

    setText('raw-day', d);
    setText('raw-month', m);
    setText('raw-year1', y.slice(0, 2));
    setText('raw-year2', y.slice(2, 4));
  }

  function clearAll() {
    elYear.value = '';
    elMonth.value = '';
    elDay.value = '';
    elName.value = '';
    elNameTag.textContent = '姓名：';
    ALL_VAL_IDS.forEach(id => setText(id, '-'));
    ALL_RAW_IDS.forEach(id => setText(id, '--'));
    elYear.focus();
  }

  btnGenerate.addEventListener('click', tryCalculate);
  btnClear.addEventListener('click', clearAll);

  // 開啟儲存彈窗並產生圖片（手機可長按儲存，電腦可點下載）
  btnSave.addEventListener('click', async () => {
    const target = document.getElementById('chart-canvas');
    const name = elName.value.trim() || '七秒讀心術金字塔圖';

    saveModalBody.innerHTML = '<p class="save-modal-loading">圖片產生中，請稍候…</p>';
    saveModalDownload.style.display = 'none';
    saveModal.classList.add('open');

    try {
      const canvas = await html2canvas(target, {
        scale: 2,
        backgroundColor: '#ffffff'
      });
      const dataUrl = canvas.toDataURL('image/png');

      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = name;
      img.className = 'save-modal-img';
      saveModalBody.innerHTML = '';
      saveModalBody.appendChild(img);

      saveModalDownload.href = dataUrl;
      saveModalDownload.download = `${name}.png`;
      saveModalDownload.style.display = 'flex';
    } catch (err) {
      console.error('截圖生成失敗:', err);
      saveModalBody.innerHTML = '<p class="save-modal-loading">圖片產生失敗，請重試。</p>';
    }
  });

  saveModalClose.addEventListener('click', () => {
    saveModal.classList.remove('open');
  });
</script>
</body>
</html>
